; PlatformIO project for this example - STM32F411RET6 (Nucleo-F411RE board definition)
; Open this example folder in PlatformIO. The library is taken from the repo root.

[platformio]
src_dir = .

[env:stm32f411re]
platform = ststm32
board = nucleo_f411re
framework = arduino                 ; STM32duino (Arduino_Core_STM32)
board_build.f_cpu = 100000000L
; link library sources as objects so its SystemClock_Config() replaces the core's weak one
lib_archive = no
lib_deps = symlink://../..
lib_ldf_mode = deep+
; only this folder (not .pio/), so the build dir is never compiled as sketch source
build_src_filter = +<*.ino> +<*.cpp> +<*.h>
build_flags =
    -D DMD_HSE_CRYSTAL_8MHZ             ; system clock from external 8 MHz crystal (HSE) -> 100 MHz
    -D HSE_VALUE=8000000U
    -Wno-unused-parameter
    -D DMD_CLK_WITH_DATA=1
    -O2
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200
